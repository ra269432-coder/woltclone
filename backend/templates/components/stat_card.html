<div class="rounded-2xl shadow-lg p-6 flex flex-col hover:-translate-y-1 hover:shadow-xl transition-all duration-300 relative overflow-hidden group {{ color_class|default:'bg-gradient-to-br from-indigo-500 to-purple-600 text-white' }}">
    <!-- Optional abstract shape for premium feel -->
    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-white opacity-20 group-hover:scale-110 transition-transform duration-500 pointer-events-none"></div>
    
    <div class="flex items-start justify-between relative z-10">
        <div>
            <p class="text-[13px] font-medium opacity-80 mb-1 tracking-wide">{{ title }}</p>
            <h4 class="text-3xl font-extrabold tracking-tight">{{ value }}</h4>
        </div>
        <div class="p-3.5 rounded-2xl bg-white/20 shadow-inner backdrop-blur-sm">
            {{ icon|safe }}
        </div>
    </div>
    
    <!-- Mock Trend Indicator -->
    <div class="mt-4 flex items-center text-sm font-medium relative z-10">
        {% if 'Active' in title or 'Published' in title or 'Present' in title or 'Donation' in title %}
            <span class="flex items-center bg-white/25 px-2 py-0.5 rounded-full text-xs">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path></svg>
                +12.5%
            </span>
            <span class="opacity-80 ml-2 text-xs">vs last month</span>
        {% else %}
            <span class="flex items-center bg-white/25 px-2 py-0.5 rounded-full text-xs">
                <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7"></path></svg>
                -2.4%
            </span>
            <span class="opacity-80 ml-2 text-xs">vs last month</span>
        {% endif %}
    </div>
</div>
