<div x-data="{ show: true }" 
     x-show="show" 
     x-init="setTimeout(() => show = false, 5000)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-2"
     x-transition:enter-end="opacity-100 translate-y-0 sm:translate-x-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 translate-y-0 sm:translate-x-0"
     x-transition:leave-end="opacity-0 translate-y-2 sm:translate-y-0 sm:translate-x-2"
     class="flex items-center p-4 mb-4 text-sm border rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] backdrop-blur-md relative overflow-hidden group
        {% if 'error' in type %}text-rose-200 bg-rose-500/10 border-rose-500/20
        {% elif 'success' in type %}text-emerald-200 bg-emerald-500/10 border-emerald-500/20
        {% elif 'warning' in type %}text-amber-200 bg-amber-500/10 border-amber-500/20
        {% else %}text-cyan-200 bg-cyan-500/10 border-cyan-500/20{% endif %}" 
     role="alert">
    
    <!-- Icon -->
    <div class="shrink-0 flex items-center justify-center w-8 h-8 rounded-full mr-3
        {% if 'error' in type %}bg-rose-500/20 text-rose-400
        {% elif 'success' in type %}bg-emerald-500/20 text-emerald-400
        {% elif 'warning' in type %}bg-amber-500/20 text-amber-400
        {% else %}bg-cyan-500/20 text-cyan-400{% endif %}">
        {% if 'error' in type %}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% elif 'success' in type %}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        {% elif 'warning' in type %}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        {% else %}
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% endif %}
    </div>

    <span class="font-semibold text-[0.95rem] tracking-wide">{{ message }}</span>

    <button @click="show = false" type="button" class="ml-auto -mx-1.5 -my-1.5 rounded-xl p-1.5 hover:bg-white/10 inline-flex h-8 w-8 transition-colors
        {% if 'error' in type %}text-rose-400 hover:text-rose-300
        {% elif 'success' in type %}text-emerald-400 hover:text-emerald-300
        {% elif 'warning' in type %}text-amber-400 hover:text-amber-300
        {% else %}text-cyan-400 hover:text-cyan-300{% endif %}" aria-label="Close">
        <span class="sr-only">Close</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
</div>
