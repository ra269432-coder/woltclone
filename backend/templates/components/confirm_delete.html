{% extends "base/base.html" %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-8 w-full max-w-9xl mx-auto flex justify-center mt-10">
    <div class="bg-white shadow-lg rounded-sm border border-slate-200 p-8 max-w-md w-full">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-100 mb-4">
                <svg class="w-8 h-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Confirm Deletion</h2>
            <p class="text-slate-500 mt-2">Are you sure you want to delete <strong>"{{ object }}"</strong>? This action cannot be undone.</p>
        </div>

        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="javascript:history.back()" class="btn bg-white border-slate-200 hover:border-slate-300 text-slate-600 px-6 py-2 rounded font-medium">Cancel</a>
            <button type="submit" class="btn bg-rose-500 hover:bg-rose-600 text-white px-6 py-2 rounded font-medium">Yes, Delete</button>
        </form>
    </div>
</div>
{% endblock %}
