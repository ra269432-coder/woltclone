<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | WOLT Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center overflow-hidden">
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=2000&q=80" alt="NGO Background" class="w-full h-full object-cover"/>
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-[2px]"></div>
    </div>
    <div class="relative z-10 w-full max-w-md p-8 m-4">
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-cyan-500 rounded-full blur-[60px] opacity-50 pointer-events-none"></div>
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-fuchsia-500 rounded-full blur-[60px] opacity-50 pointer-events-none"></div>
            <div class="relative z-10">
                <div class="flex justify-center mb-8">
                    <div class="w-20 h-20 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/20 shadow-lg p-3">
                        <img src="{% static 'logo.png' %}" alt="WOLT" class="w-full h-full object-contain filter drop-shadow-md brightness-200 contrast-200">
                    </div>
                </div>
                <h2 class="text-3xl font-bold text-center mb-2 text-white">Reset Password</h2>
                <p class="text-slate-300 text-center mb-8 text-sm">Enter your email to receive a reset link</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-8">
                        <label class="block text-slate-300 text-sm font-semibold mb-2" for="email">Email Address</label>
                        <input class="w-full px-4 py-3 bg-slate-900/40 border border-white/10 rounded-xl text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent transition-all backdrop-blur-sm" id="email" type="email" name="email" placeholder="your@email.com" required autofocus>
                    </div>
                    <button class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-cyan-500/30 transition-all duration-300 transform hover:-translate-y-0.5 mb-4" type="submit">
                        Send Reset Link
                    </button>
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-cyan-400 hover:text-cyan-300 text-sm font-medium transition-colors">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
        <p class="text-center text-slate-400 text-sm mt-8 relative z-10">
            &copy; {% now "Y" %} Way of Light Trust. All rights reserved.
        </p>
    </div>
</body>
</html>
